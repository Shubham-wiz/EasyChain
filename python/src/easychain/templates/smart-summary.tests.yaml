# Test Set for Smart summary length. Same setup as summarise-url.tests.yaml.
flow: smart-summary.flow.yaml
cases:
- name: Short page (langchain) gets a one-sentence summary
  inputs: {url: "${base_url}/pages/langchain"}
  expect:
    route: {is_long: Short}
    steps: [brief]
    output.summary: {not_empty: true}
