# Test Set for the Approval workflow (stand-in AI; answers play the person in the Inbox).
flow: approve-reply.flow.yaml
stand_in: true
cases:
- name: 'Approve: Hi, my order 1234 hasn''t arrived yet. Ca'
  inputs:
    email: Hi, my order 1234 hasn't arrived yet. Can you check where it is?
  answers:
  - action: approve
    comment: Looks good
  expect:
    route:
      review: Approved
    output.sent: true
    output.decision: Approved
    output.sent_reply:
      not_empty: true
    output.decision_comment: Looks good
- name: 'Edit: I was charged twice for my subscription '
  inputs:
    email: I was charged twice for my subscription this month.
  answers:
  - action: approve
    value: Thanks for writing! We are on it (ticket 1).
  expect:
    route:
      review: Approved
    output.sent_reply: Thanks for writing! We are on it (ticket 1).
    output.decision: Approved
- name: 'Reject: How do I change the email address on my '
  inputs:
    email: How do I change the email address on my account?
  answers:
  - action: reject
    comment: Too vague
  expect:
    route:
      review: Rejected
    output.decision: Rejected
    output.decision_comment: Too vague
    output.sent:
      equals: null
