# For making new migrations from the command line (Easy Chain runs them itself at start-up):
#   cd python
#   EASYCHAIN_DATABASE_URL=sqlite:///an-up-to-date.db uv run alembic \
#     -c src/easychain/server/migrations/alembic.ini revision --autogenerate --rev-id 0002 -m "what changed"
[alembic]
script_location = %(here)s
file_template = %%(rev)s_%%(slug)s
