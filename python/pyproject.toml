[project]
name = "easychain"
version = "0.1.0"
description = "Draw your AI app, press Run, watch it think, ship it with one click. A visual builder on top of LangChain and LangGraph."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Easy Chain contributors" }]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
]
# LangChain-stack versions are pinned exactly (ARCHITECTURE.md, "Version policy").
# Bump them only after every template's Test Set passes on the new versions.
dependencies = [
  "langgraph==1.2.12",
  "langchain==1.4.3",
  "langchain-core==1.6.6",
  "langchain-openai==1.6.7",
  "langchain-anthropic==1.7.5",
  "langchain-ollama==1.1.0",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "httpx>=0.27,<1",
  "cryptography>=43",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langgraph-checkpoint-postgres==3.1.2",
  "aiosqlite>=0.20",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "sqlalchemy>=2.0,<3",
]

[project.scripts]
easychain = "easychain.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "jsonschema>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easychain"]
# The built web app is copied into server/static (git-ignored) before building a wheel.
artifacts = ["src/easychain/server/static/**"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.coverage.run]
source = ["easychain"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body"]
