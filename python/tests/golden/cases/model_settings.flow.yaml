version: 1
name: Model settings
steps:
- id: input
  type: input
  settings:
    fields:
    - name: question
- id: openai
  type: ai_model
  name: OpenAI with everything
  settings:
    model: openai:gpt-4.1-mini
    prompt: question
    temperature: 0.7
    max_tokens: 300
    reasoning_effort: low
    stop: ["\n\n", END]
    timeout: 20
    max_retries: 1
    save_as: first
- id: local
  type: ai_model
  name: Local model
  settings:
    model: ollama:llama3.2
    prompt: first
    base_url: http://gpu-box:11434
    save_as: second
- id: claude
  type: ai_model
  name: Claude
  settings:
    model: anthropic:claude-sonnet-5-5
    prompt: second
    save_as: third
- id: output
  type: output
  settings:
    fields: [first, second, third]
connections:
- {from: input, to: openai}
- {from: openai, to: local}
- {from: local, to: claude}
- {from: claude, to: output}
