# One command starts the app:  docker compose up
# Then open http://localhost:8000
#
# Keys can be added in the app (Settings → API keys; stored encrypted in the volume)
# or passed in from your shell / a .env file next to this file.
services:
  easychain:
    build: .
    image: easychain:0.1.0
    ports:
      # Localhost only: Phase 1 has no login, so do not publish it on a public interface.
      - "127.0.0.1:${EASYCHAIN_PORT:-8000}:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # A model server on your machine, e.g. Ollama (works on Docker Desktop):
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      # Set this to keep the secrets vault readable if the volume moves between machines.
      EASYCHAIN_SECRET_KEY: ${EASYCHAIN_SECRET_KEY:-}
    volumes:
      - easychain-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  easychain-data:
