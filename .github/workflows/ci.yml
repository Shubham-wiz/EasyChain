name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (compiler, runtime, server, workers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    services:
      # The queue, worker crash, day-later approval and Knowledge Base tests run on SQLite and
      # on Postgres (with pgvector).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EASYCHAIN_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
      - run: uv sync --frozen --extra providers
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Published JSON Schema is up to date
        run: |
          uv run easychain schema -o ../spec/flow.schema.json
          git diff --exit-code -- ../spec/flow.schema.json
      - name: Tests
        run: uv run pytest --cov=easychain --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Compiler coverage is at least 90%
        run: uv run coverage report --include="src/easychain/compiler/*,src/easychain/steps/*" --fail-under=90

  web:
    name: Web (types, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @easychain/web typecheck
      - run: pnpm --filter @easychain/web test
      - run: pnpm --filter @easychain/web build
      - name: Client package (@easychain/client)
        run: |
          pnpm --filter @easychain/client typecheck
          pnpm --filter @easychain/client test
          pnpm --filter @easychain/client build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
      - run: uv sync --frozen --extra providers
        working-directory: python
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @easychain/web exec playwright install --with-deps chromium
      - run: pnpm --filter @easychain/web build
      - run: pnpm --filter @easychain/web e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  windows:
    # Easy Chain runs from source on Windows too. This job runs the Python suite (SQLite and the
    # runner's own Postgres, which has no pgvector), the CLI and worker, and the web checks.
    name: Windows (Python, CLI, web)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
      - run: uv sync --frozen --extra providers
        working-directory: python
      - name: Put the runner's Postgres on PATH (the tests start their own throwaway server)
        run: Add-Content $env:GITHUB_PATH $env:PGBIN
      - name: Tests
        working-directory: python
        run: uv run pytest
      - name: The CLI runs a flow and a worker starts and stops
        working-directory: python
        run: |
          $env:EASYCHAIN_HOME = Join-Path $env:RUNNER_TEMP "easychain-home"
          uv run easychain run ../examples/hello.flow.yaml --input "question=What is LangGraph?" --stand-in > out.json
          Get-Content out.json
          uv run easychain validate ../examples/hello.flow.yaml > validate.txt
          Get-Content validate.txt
          $worker = Start-Process uv -ArgumentList "run","easychain","worker" -PassThru -NoNewWindow
          Start-Sleep -Seconds 8
          if ($worker.HasExited) { throw "The worker exited early (code $($worker.ExitCode))." }
          Stop-Process -Id $worker.Id -Force
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @easychain/web test
      - run: pnpm --filter @easychain/client test
      - name: The web app builds and the server serves it
        working-directory: python
        run: |
          pnpm --dir .. build
          $server = Start-Process uv -ArgumentList "run","easychain","dev","--port","8123" -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..60) {
            try { $page = Invoke-WebRequest http://127.0.0.1:8123/ -UseBasicParsing; $ok = $true; break } catch { Start-Sleep 1 }
          }
          Stop-Process -Id $server.Id -Force
          if (-not $ok -or $page.Content -notmatch "<title>Easy Chain</title>") { throw "The app didn't serve the web page." }

  docker:
    name: Docker image and Compose (Postgres + worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t easychain:ci .
      - name: Smoke test (one container, SQLite)
        run: |
          docker run -d --name ec -p 8000:8000 easychain:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/ | grep -q "<title>Easy Chain</title>"
          docker rm -f ec
      - name: Compose with Postgres and a worker runs a flow
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf localhost:8000/api/health && break; sleep 2; done
          curl -sf localhost:8000/api/health | grep -q '"database":"postgresql"'
          ./scripts/compose-smoke.sh
          docker compose down -v
